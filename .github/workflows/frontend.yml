name: frontend
on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @floodroute/ui check
      - run: pnpm --filter @floodroute/citizen check
      - uses: actions/upload-artifact@v4
        with:
          name: floodroute-frontend
          path: apps/citizen/dist
          if-no-files-found: error
