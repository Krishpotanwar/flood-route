[project]
name = "floodroute"
version = "0.0.1"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "psycopg[binary,pool]>=3.2",
    "httpx>=0.27",
    "pillow>=10.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[tool.setuptools.packages.find]
include = ["floodroute*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "C4",
    "A", "BLE", "PIE", "RSE", "RUF", "SIM", "YTT", "RET",
]
ignore = [
    "E501",  # Line length handled by code style / SQL multiline
    "B008",  # Depends() in parameter defaults (FastAPI standard)
]

[tool.ruff.lint.per-file-ignores]
"tests/test_benchmark.py" = ["E402"]
"tests/route/test_route_valhalla.py" = ["E741"]
"tests/ingest/test_ingest_sachet.py" = ["C408"]
"tests/ingest/ingest_testkit.py" = ["C408"]
